<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive social media photo sharing web app"
    />
    <meta name="author" content="Charles Nguyen" />
    <meta
      name="keywords"
      content="social media, photos, sharing, app, interactive"
    />

    <title>Spots</title>
  </head>

  <body class="page">
    <header class="header">
      <img
        src="<%= require('./images/Logo.svg') %>"
        alt="Spots Logo"
        class="header__logo"
      />
    </header>

    <main class="content">
      <section class="profile page__section">
        <div class="profile__avatar-container">
          <img
            src="<%= require('./images/avatar.jpg') %>"
            alt="Picture of Bessie Coleman"
            class="profile__picture"
          />
          <div class="profile__avatar-overlay">
            <img
              src="<%= require('./images/pencil.svg') %>"
              alt="Edit Avatar"
              class="profile__avatar-pencil"
            />
            <p class="profile__avatar-edit-text">Edit Avatar</p>
          </div>
        </div>
        <div class="profile__description">
          <h1 class="profile__description-title">Bessie Coleman</h1>
          <p class="profile__description-subtitle">Civil Aviator</p>
          <button type="button" class="profile__description-button">
            <img
              src="<%= require('./images/pencil.svg') %>"
              alt="Pencil Icon"
              class="profile__description-button-icon"
            />
            Edit Profile
          </button>
        </div>

        <button type="button" class="profile__button">
          <img
            src="<%= require ('./images/plus.svg') %>"
            alt="header button image"
            class="profile__button-image"
          />
          New Post
        </button>
      </section>

      <section class="cards page__section">
        <ul class="cards__list">
          <template id="card-template">
            <li class="card">
              <img class="card__image" alt="" />
              <div class="card__caption">
                <h2 class="card__title"></h2>
                <button type="button" class="card__like-button"></button>
                <button type="button" class="card__delete-button"></button>
              </div>
            </li>
          </template>
        </ul>
      </section>

      <footer class="footer">
        <p class="footer__copyright">2023 &copy; Spots</p>
      </footer>

      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          ></button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form">
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
                required
              />
              <span class="modal__error profile-name-input-error"></span>
            </label>

            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
                required
              />
              <span class="modal__error profile-description-input-error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          ></button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form">
            <label for="card-image-input" class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span class="modal__error card-image-input-error"></span>
            </label>

            <label for="caption-input" class="modal__label">
              Caption
              <input
                id="caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span class="modal__error caption-input-error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="preview-modal">
        <div class="modal__container modal__container_type_image">
          <button type="button" class="modal__close-btn"></button>
          <img class="modal__preview-image" alt="" />
          <p class="modal__caption"></p>
        </div>
      </div>

      <div class="modal" id="delete-image-modal">
        <div class="modal__container modal__container_type_delete">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          ></button>
          <h2 class="modal__title">
            Are you sure you want to delete this image?
          </h2>
          <div class="modal__buttons">
            <button type="button" class="modal__delete-btn">Delete</button>
            <button type="button" class="modal__cancel-btn">Cancel</button>
          </div>
        </div>
      </div>

      <div class="modal" id="update-avatar-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          ></button>
          <h2 class="modal__title">Update avatar</h2>
          <form class="modal__form">
            <label for="avatar-url-input" class="modal__label">
              Image link
              <input
                id="avatar-url-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span class="modal__error avatar-url-input-error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
